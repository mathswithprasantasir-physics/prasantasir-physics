<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NEET Physics{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='student_style.css') }}">
    
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    
    <!-- MathJax v3 -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
    
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden !important;
        }
        body {
            background: #f0f4fa !important;
            display: block !important;
            text-align: left !important;
        }
        .container {
            max-width: 1280px !important;
            width: 100% !important;
            margin: 0 auto !important;
            padding: 20px !important;
            text-align: left !important;
        }
        .container * {
            text-align: left !important;
        }
        .empty-state, .footer-note {
            text-align: center !important;
        }
        header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            flex-wrap: wrap !important;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().then(function() {
                    console.log('✅ MathJax rendered');
                }).catch(function(err) {
                    console.log('MathJax error:', err);
                });
            }
        });
    </script>
    {% block extra_js %}{% endblock %}


    <!-- ===== FOOTER ===== -->
    <footer class="footer-note">
        <p>© 2027 NEET Physics Practice. All rights reserved.</p>
    </footer>


    <!-- ===== SCRIPTS ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>

    <!-- ===== BOOKMARK SCRIPT ===== -->
    <script>
        async function toggleBookmark(questionId, btnElement, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            try {
                const response = await fetch('/api/bookmark/' + questionId, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                const data = await response.json();
                if (data.success) {
                    const btns = document.querySelectorAll('.bookmark-btn[data-id="' + questionId + '"]');
                    btns.forEach(btn => {
                        const icon = btn.querySelector('i');
                        const label = btn.querySelector('.bm-text');
                        if (data.isBookmarked) {
                            btn.classList.add('bookmarked');
                            if (icon) icon.className = 'fas fa-bookmark';
                            if (label) label.textContent = 'Bookmarked';
                            btn.setAttribute('title', 'Remove Bookmark');
                        } else {
                            btn.classList.remove('bookmarked');
                            if (icon) icon.className = 'far fa-bookmark';
                            if (label) label.textContent = 'Bookmark';
                            btn.setAttribute('title', 'Save Bookmark');
                        }
                    });
                    
                    const navCounts = document.querySelectorAll('.nav-bookmark-count');
                    navCounts.forEach(el => el.textContent = data.count);

                    showBookmarkToast(data.isBookmarked ? '🔖 Question bookmarked!' : 'Bookmark removed');
                }
            } catch (err) {
                console.error('Bookmark toggle failed:', err);
            }
        }

        function showBookmarkToast(message) {
            let toast = document.getElementById('bm-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'bm-toast';
                toast.style.cssText = 'position:fixed; bottom:25px; right:25px; background:#1e293b; color:#fff; padding:12px 22px; border-radius:12px; font-weight:600; font-size:0.9rem; box-shadow:0 10px 25px rgba(0,0,0,0.3); z-index:9999; transition:all 0.3s ease; opacity:0; transform:translateY(10px); pointer-events:none; border:1px solid #334155;';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
            }, 2000);
        }
    </script>

    <!-- ===== DARK MODE SCRIPT ===== -->
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            
            const btn = document.querySelector('.dark-toggle i');
            if (document.body.classList.contains('dark-mode')) {
                if (btn) btn.className = 'fas fa-sun';
            } else {
                if (btn) btn.className = 'fas fa-moon';
            }
        }

        // Check saved preference
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            const btn = document.querySelector('.dark-toggle i');
            if (btn) btn.className = 'fas fa-sun';
        }

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', function(e) {
            const key = e.key.toUpperCase();
            if (['A', 'B', 'C', 'D'].includes(key)) {
                const cards = document.querySelectorAll('.question-card');
                for (let card of cards) {
                    const options = card.querySelector('.q-options');
                    if (options && options.dataset.answered !== 'true') {
                        const option = card.querySelector(`.option-item[data-option="${key}"]`);
                        if (option) {
                            option.click();
                            break;
                        }
                    }
                }
            }
            
            if (e.key === 'n' || e.key === 'N') {
                const cards = document.querySelectorAll('.question-card');
                for (let i = 0; i < cards.length; i++) {
                    const options = cards[i].querySelector('.q-options');
                    if (options && options.dataset.answered !== 'true') {
                        cards[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        break;
                    }
                }
            }
        });

        console.log('⌨️ Keyboard Shortcuts: A, B, C, D = Select Option | N = Next Question');
    </script>

</body>
</html>
